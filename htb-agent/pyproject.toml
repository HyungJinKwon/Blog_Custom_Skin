[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htb-agent"
version = "2.4.0"   # src/htb_agent/__init__.py 의 __version__ 과 일치시킬 것
description = "HTB 머신 승인제 풀이 에이전트 (권한 확인 자산 한정, 레드팀 학습용)"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
config = ["pyyaml>=6.0"]

[project.scripts]
# 정식 명령은 'assassin'. 'htb-agent' 는 하위호환 별칭(동일 진입점).
assassin = "htb_agent.main:main"
htb-agent = "htb_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# 번들 지식베이스·벤치 문제를 패키지 데이터로 포함(편집모드 아닌 일반 설치에서도 동작).
# 지식베이스는 저장소 루트의 knowledge/ 를 패키지 안(htb_agent/knowledge)로도 동봉하려면
# 빌드 전 복사가 필요하나, 기본 사용은 소스 트리(pip install -e .) 또는 --knowledge 로 지정.
[tool.setuptools.package-data]
htb_agent = ["knowledge/**/*", "bench/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # 라인 길이는 경고만(한국어 주석 고려)
