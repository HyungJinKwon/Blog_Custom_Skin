name: htb-agent CI

on:
  push:
    paths: ["htb-agent/**", ".github/workflows/htb-agent-ci.yml"]
  pull_request:
    paths: ["htb-agent/**", ".github/workflows/htb-agent-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: htb-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 전체 테스트 (표준 라이브러리만, 외부 의존성 없음)
        run: python3 tests/run_all.py
      - name: 컴파일 체크
        run: python3 -m py_compile src/htb_agent/*.py src/htb_agent/*/*.py
      - name: README CLI 옵션 표 최신 여부
        run: python3 scripts/gen_cli_docs.py --check

  lint:
    runs-on: ubuntu-latest
    # 게이트: src 의 ruff·mypy 0건을 유지한다(새 경고가 생기면 PR 실패). 버전 고정으로 결과 재현.
    defaults:
      run:
        working-directory: htb-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ruff lint (게이트)
        run: |
          pip install "ruff==0.16.8"
          ruff check src/
      - name: mypy 타입체크 (게이트)
        run: |
          pip install "mypy==2.3.1"
          mypy src/ --ignore-missing-imports
